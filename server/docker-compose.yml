services:
    postgres:
        image: postgres:15-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: api_pulse
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql
        networks:
            - api-pulse-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5    
    MongoDB:
        image: mongo:6.0
        container_name: api-pulse-mongodb
        ports:
            - "27018:27017"
        volumes:
            - mongo_data:/data/db
        networks:
            - api-pulse-network
        restart: unless-stopped
    RabbitMQ:
        image: rabbitmq:3-management-alpine
        container_name: api-pulse-rabbitmq
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
            RABBITMQ_DEFAULT_VHOST: api-pulse    
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        networks:
            - api-pulse-network
        restart: unless-stopped 
        healthcheck:
            test: ["CMD-SHELL", "rabbitmqctl status || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5           
    PgAdmin:
        image: dpage/pgadmin4:7.0
        container_name: api-pulse-pgadmin
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@pgadmin.org
            PGADMIN_DEFAULT_PASSWORD: admin
        ports:
            - "8080:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        networks:
            - api-pulse-network
        restart: unless-stopped
        depends_on:
            - postgres

    api-app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: api-pulse-app
        environment:
            NODE_ENV: production
            PORT: 3002
            MONGO_URI: mongodb://MongoDB:27017/api-pulse
            MONGO_DB_NAME: api-pulse
            PG_HOST: postgres
            PG_PORT: 5432
            PG_DATABASE: api_pulse
            PG_USER: postgres
            PG_PASSWORD: postgres
            RABBITMQ_URL: amqp://guest:guest@RabbitMQ:5672/api-pulse
            RABBITMQ_QUEUE: api_hits
            JWT_SECRET: ${JWT_SECRET}
            JWT_EXPIRES_IN: 24h
            RATE_LIMIT_WINDOW_MS: 60000
            RATE_LIMIT_MAX_REQUESTS: 100
        ports:
            - "3002:3002"
        volumes:
            - ./logs:/app/logs
        networks:
            - api-pulse-network
        depends_on:
            postgres:
                condition: service_healthy
            RabbitMQ:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
            interval: 30s
            timeout: 10s
            retries: 3  
    consumer:
        build:
            context: .
            dockerfile: Dockerfile.consumer
        container_name: api-pulse-consumer
        environment:
            NODE_ENV: production
            MONGO_URI: mongodb://MongoDB:27017/api-pulse
            MONGO_DB_NAME: api-pulse
            PG_HOST: postgres
            PG_PORT: 5432
            PG_DATABASE: api_pulse
            PG_USER: postgres
            PG_PASSWORD: postgres
            RABBITMQ_URL: amqp://guest:guest@RabbitMQ:5672/api-pulse
            RABBITMQ_QUEUE: api_hits
        networks:
            - api-pulse-network
        depends_on:
            postgres:
                condition: service_healthy
            RabbitMQ:
                condition: service_healthy
            MongoDB:
                condition: service_started
        restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  mongo_data: 
    driver: local
  rabbitmq_data:
    driver: local
  pgadmin_data:
    driver: local   
networks:
  api-pulse-network:
    driver: bridge    